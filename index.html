function showQuestion() {
  let pair = questions[current];

  document.getElementById("progress").innerText = `ข้อ ${current+1}/15`;

  let html = "";
  pair.forEach(num => {
    html += `
    <button onclick="choose(${num})">
      <img src="RENJUN${num}.jpg">
      <p>${texts[num]}</p>
    </button>`;
  });

  document.getElementById("choices").innerHTML = html;
}

function choose(num) {
  selected.push(num);
  current++;

  if(current < 15){
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  let random = selected[Math.floor(Math.random()*selected.length)];

  document.getElementById("resultImg").src = `RENJUN${random}.jpg`;

  document.getElementById("resultText").innerText =
  "คนสวยที่คุณเลือกคือคนสวยคนนี้ 💖\nการมัดใจต้อง..." + advice[random-1];
}

showQuestion();
</script>
